<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Interactive 3D simulator for India's major dams — model reservoir loading and structural breach." />
  <title>Dambreak — Dam Failure &amp; Flood Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== TOKENS ===== */
    :root {
      --bg:      #0b0f19;
      --bg-2:    #0f172a;
      --panel:   rgba(15, 23, 42, 0.94);
      --panel-2: #1e293b;
      --line:    rgba(51, 65, 85, 0.7);
      --line-2:  rgba(71, 85, 105, 0.7);
      --fg:      #f1f5f9;
      --fg-2:    #94a3b8;
      --fg-3:    #64748b;
      --accent:  #38bdf8;
      --accent-b:#0284c7;
      --danger:  #ef4444;
      --warn:    #f59e0b;
      --ok:      #10b981;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(94,163,196,0.3); }
    .mono { font-family: var(--mono); font-feature-settings: "tnum" 1; }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: var(--bg);
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .boot-mark {
      width: 46px; height: 46px; color: var(--accent);
      animation: boot-pulse 1.8s ease-in-out infinite;
    }
    @keyframes boot-pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    #loading-screen h1 {
      font-size: 0.95rem; font-weight: 500; letter-spacing: 0.34em;
      text-transform: uppercase; color: var(--fg-2);
    }
    /* ===== CANVAS ===== */
    #sim-canvas { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; }

    /* ===== MAP SCREEN ===== */
    #map-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      background:
        radial-gradient(120% 90% at 62% 32%, rgba(94,163,196,0.06), transparent 55%),
        var(--bg);
    }

    /* Header */
    .map-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 30px; height: 30px; }
    .brand-mark .bm-body { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .brand-mark .bm-water { stroke: var(--accent-b); stroke-width: 1.4; opacity: 0.75; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.22em; }
    .brand-sub { font-size: 0.72rem; color: var(--fg-3); letter-spacing: 0.04em; }

    .top-stats { display: flex; gap: 30px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .stat-num { font-family: var(--mono); font-size: 1.15rem; font-weight: 500; color: var(--fg); }
    .stat-num em { font-style: normal; font-size: 0.7rem; color: var(--fg-3); margin-left: 1px; }
    .stat-cap { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3); }

    .map-body { flex: 1; display: flex; overflow: hidden; }

    /* ===== SIDEBAR ===== */
    .map-side {
      width: 356px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--bg-2); border-right: 1px solid var(--line); overflow: hidden;
    }
    .side-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .side-label {
      display: block; font-size: 0.62rem; text-transform: uppercase;
      letter-spacing: 0.16em; color: var(--fg-3); margin-bottom: 9px;
    }
    .side-search {
      width: 100%; padding: 9px 12px; font-family: var(--sans); font-size: 0.82rem;
      color: var(--fg); background: var(--panel); border: 1px solid var(--line-2);
      border-radius: 6px; outline: none; transition: border-color 0.15s;
    }
    .side-search::placeholder { color: var(--fg-3); }
    .side-search:focus { border-color: var(--accent); }

    .dam-list { flex: 1; overflow-y: auto; padding: 6px; }
    .dam-list::-webkit-scrollbar { width: 8px; }
    .dam-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--bg-2); }

    .dam-item {
      display: flex; align-items: center; gap: 11px; width: 100%;
      padding: 9px 12px; border: 1px solid transparent; border-radius: 6px;
      background: none; cursor: pointer; text-align: left; color: inherit;
      font-family: var(--sans); transition: background 0.14s, border-color 0.14s;
    }
    .dam-item:hover { background: var(--panel); }
    .dam-item.active { background: var(--panel-2); border-color: var(--line-2); }
    .di-marker {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--fg-3); box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
      transition: background 0.14s;
    }
    .dam-item:hover .di-marker { background: var(--accent); }
    .dam-item.active .di-marker { background: var(--accent-b); box-shadow: 0 0 0 3px rgba(94,163,196,0.18); }
    .di-main { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .di-name { font-size: 0.84rem; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .di-meta { font-size: 0.7rem; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .di-h { font-family: var(--mono); font-size: 0.78rem; color: var(--fg-2); flex-shrink: 0; }
    .di-h em { font-style: normal; font-size: 0.62rem; color: var(--fg-3); }

    /* ===== DETAIL PANEL ===== */
    .dam-detail { border-top: 1px solid var(--line-2); padding: 18px 20px 20px; background: var(--panel); }
    .detail-head { margin-bottom: 14px; }
    .detail-head h2 { font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
    .detail-loc { display: block; margin-top: 3px; font-size: 0.7rem; color: var(--fg-3); font-family: var(--mono); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-bottom: 18px; }
    .detail-grid dt { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--fg-3); margin-bottom: 3px; }
    .detail-grid dd { font-size: 0.88rem; color: var(--fg); font-family: var(--mono); }
    .btn-launch {
      width: 100%; padding: 11px; border: 1px solid var(--accent); border-radius: 6px;
      background: rgba(94,163,196,0.1); color: var(--accent-b);
      font-family: var(--sans); font-size: 0.84rem; font-weight: 600; letter-spacing: 0.02em;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
    }
    .btn-launch:hover { background: rgba(94,163,196,0.2); }
    .btn-launch:active { transform: translateY(1px); }

    /* ===== MAP STAGE ===== */
    .map-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 28px; }
    .map-frame { width: 100%; height: 100%; max-width: 780px; display: flex; align-items: center; justify-content: center; }
    .india-map { width: 100%; height: 100%; overflow: visible; }

    .land { stroke: none; }
    .coast {
      fill: none; stroke: var(--accent); stroke-width: 1px;
      stroke-linejoin: round; stroke-linecap: round; opacity: 0.6;
      vector-effect: non-scaling-stroke;
    }
    .grid-line { stroke: rgba(255,255,255,0.06); stroke-width: 0.5px; vector-effect: non-scaling-stroke; }

    .marker { cursor: pointer; }
    .marker-dot { fill: #b7c1cd; stroke: var(--bg); stroke-width: 1px; vector-effect: non-scaling-stroke; transition: fill 0.18s; }
    .marker-ring { fill: none; stroke: var(--accent-b); stroke-width: 1px; vector-effect: non-scaling-stroke; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .marker-label {
      font-family: var(--sans); font-size: 0.62px; font-weight: 500; fill: var(--fg);
      paint-order: stroke; stroke: var(--bg); stroke-width: 0.14px;
      opacity: 0; transition: opacity 0.18s; dominant-baseline: middle;
    }
    .marker:hover .marker-dot { fill: var(--accent-b); }
    .marker:hover .marker-label, .marker.selected .marker-label { opacity: 1; }
    .marker.selected .marker-dot { fill: var(--accent-b); }
    .marker.selected .marker-ring { opacity: 0.7; animation: ping 1.9s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 70% { opacity: 0; } 100% { transform: scale(2.6); opacity: 0; } }

    .map-legend {
      position: absolute; left: 28px; bottom: 22px; display: flex; align-items: center; gap: 18px;
      font-size: 0.68rem; color: var(--fg-3);
    }
    .lg-item { display: flex; align-items: center; gap: 6px; }
    .lg-dot { width: 7px; height: 7px; border-radius: 50%; background: #b7c1cd; }
    .lg-dot.sel { background: var(--accent-b); }
    .lg-hint { padding-left: 18px; border-left: 1px solid var(--line-2); }

    /* ===== TOOLTIP ===== */
    .map-tooltip {
      position: absolute; display: none; z-index: 10; pointer-events: none;
      padding: 9px 12px; background: var(--panel-2); border: 1px solid var(--line-2);
      border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      flex-direction: column; gap: 2px; white-space: nowrap;
    }
    .map-tooltip strong { font-size: 0.8rem; font-weight: 600; color: var(--fg); }
    .map-tooltip span { font-size: 0.7rem; color: var(--fg-3); }

    /* ===== FOOTER ===== */
    .map-foot {
      display: flex; justify-content: space-between; padding: 10px 28px;
      border-top: 1px solid var(--line); font-size: 0.68rem; color: var(--fg-3);
    }
    /* ============================================================
       SIMULATION UI
       ============================================================ */
    #sim-ui {
      position: fixed; top: 0; right: 0; z-index: 50;
      width: 372px; max-height: 100vh; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px));
      display: flex; flex-direction: column; gap: 12px;
      pointer-events: none; overflow-y: auto;
    }
    #sim-ui > * { pointer-events: auto; }

    .sim-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 8px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 11px; font-family: var(--sans); font-size: 0.74rem; color: var(--fg-2);
      background: none; border: 1px solid var(--line-2); border-radius: 6px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .back-btn:hover { color: var(--fg); border-color: var(--fg-3); }
    .sim-ident { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .sim-name { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sim-loc { font-size: 0.7rem; color: var(--fg-3); }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .panel-sec { padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .panel-sec:last-child { border-bottom: none; }
    .sec-head {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-3);
      margin-bottom: 12px;
    }
    .sec-head .mono { font-size: 0.95rem; color: var(--accent-b); letter-spacing: 0; text-transform: none; }

    /* Slider */
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: var(--line-2); outline: none; cursor: pointer; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--fg); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line-2); cursor: grab; transition: background 0.15s; }
    .slider::-webkit-slider-thumb:hover { background: var(--accent-b); }
    .slider::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: 3px solid var(--panel); cursor: grab; }

    /* Gauge */
    .gauge { position: relative; height: 6px; margin-top: 14px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .gauge-fill { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-b)); transition: width 0.12s linear, background 0.3s; }
    .gauge-fill.danger { background: linear-gradient(90deg, var(--warn), var(--danger)); }
    .gauge-mark { position: absolute; top: -3px; width: 1px; height: 12px; background: var(--danger); }
    .mark-label { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 0.54rem; letter-spacing: 0.08em; color: var(--danger); white-space: nowrap; }
    .sec-note { margin-top: 14px; font-size: 0.72rem; color: var(--fg-2); }
    .sec-note b { color: var(--warn); font-weight: 500; }
    /* Buttons */
    .btns { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; padding: 10px 14px; border-radius: 6px; cursor: pointer;
      font-family: var(--sans); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.01em;
      border: 1px solid var(--line-2); background: var(--panel-2); color: var(--fg);
      transition: background 0.15s, border-color 0.15s, transform 0.08s, opacity 0.15s;
    }
    .btn:hover { background: #1c232e; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: var(--accent); background: rgba(94,163,196,0.12); color: var(--accent-b); }
    .btn.primary:hover { background: rgba(94,163,196,0.2); }
    .btn.danger { border-color: rgba(209,84,63,0.5); background: rgba(209,84,63,0.1); color: #e88873; }
    .btn.danger:hover { background: rgba(209,84,63,0.2); }
    .btn.danger:disabled { border-color: var(--line); background: var(--panel-2); color: var(--fg-3); cursor: not-allowed; opacity: 0.55; transform: none; }
    .btn.ghost { background: none; color: var(--fg-2); }

    /* Status */
    .status { display: flex; align-items: center; gap: 9px; padding: 12px 16px; font-size: 0.76rem; color: var(--fg-2); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--fg-3); }
    .status-dot.idle { background: var(--fg-3); }
    .status-dot.warn { background: var(--warn); animation: blink 1.1s infinite; }
    .status-dot.danger { background: var(--danger); animation: blink 0.45s infinite; }
    .status-dot.active { background: var(--ok); }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* Metrics */
    .metrics { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .metric { padding: 11px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric:nth-child(2n) { border-right: none; }
    .metric:nth-last-child(-n+2) { border-bottom: none; }
    .metric-label { display: block; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--fg-3); margin-bottom: 3px; }
    .metric-value { font-family: var(--mono); font-size: 0.98rem; color: var(--fg); }

    .sim-hint {
      align-self: flex-start; padding: 7px 12px; font-size: 0.68rem; color: var(--fg-3);
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    }

    /* ===== DAM DOSSIER ===== */
    .dossier-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(94,163,196,0.07), transparent);
    }
    .dsr-id { min-width: 0; }
    .dsr-kicker {
      display: block; font-size: 0.56rem; text-transform: uppercase;
      letter-spacing: 0.18em; color: var(--fg-3); margin-bottom: 5px;
    }
    .dsr-title { font-size: 0.98rem; font-weight: 600; line-height: 1.2; letter-spacing: 0.01em; }
    .dsr-badge {
      flex-shrink: 0; padding: 3px 9px 4px; border-radius: 100px; border: 1px solid;
      font-family: var(--mono); font-size: 0.56rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap;
    }
    .dsr-badge.ok { color: var(--ok); border-color: rgba(111,174,127,0.4); background: rgba(111,174,127,0.1); }
    .dossier-body { padding: 15px 16px 16px; }

    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 16px; }
    .spec dt {
      font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--fg-3); margin-bottom: 4px;
    }
    .spec dd { font-family: var(--mono); font-size: 0.86rem; color: var(--fg); }
    .spec dd em { font-style: normal; font-size: 0.64rem; color: var(--fg-3); }

    .dsr-purpose {
      margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line);
      font-size: 0.75rem; line-height: 1.5; color: var(--fg-2);
    }
    .dsr-purpose b { color: var(--fg); font-weight: 600; }

    /* Timeline */
    .timeline { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line); }
    .tl-sec-label {
      font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--fg-3); margin-bottom: 13px;
    }
    .tl-item { display: flex; gap: 12px; padding-bottom: 15px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-rail { position: relative; flex-shrink: 0; width: 9px; }
    .tl-dot {
      position: relative; z-index: 1; display: block; width: 9px; height: 9px;
      margin-top: 3px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 3px rgba(94,163,196,0.14);
    }
    .tl-line { position: absolute; left: 50%; top: 4px; bottom: -15px; width: 1px; transform: translateX(-50%); background: var(--line-2); }
    .tl-item:last-child .tl-line { display: none; }
    .tl-item.event .tl-dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(224,169,85,0.16); }
    .tl-item.safe .tl-dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(111,174,127,0.16); }
    .tl-body { flex: 1; min-width: 0; }
    .tl-head { display: flex; align-items: baseline; gap: 9px; }
    .tl-year { font-size: 0.8rem; color: var(--accent-b); }
    .tl-item.event .tl-year { color: var(--warn); }
    .tl-item.safe .tl-year { color: var(--ok); }
    .tl-title { font-size: 0.78rem; font-weight: 600; color: var(--fg); }
    .tl-desc { margin-top: 3px; font-size: 0.72rem; line-height: 1.45; color: var(--fg-3); }

    .dsr-foot { margin-top: 15px; font-size: 0.6rem; line-height: 1.45; color: var(--fg-3); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 940px) {
      .top-stats { gap: 18px; }
      .map-side { width: 288px; }
      #sim-ui { width: 320px; }
    }
    @media (max-width: 680px) {
      .map-top { flex-direction: column; gap: 14px; align-items: flex-start; }
      .map-body { flex-direction: column; }
      .map-side { width: 100%; max-height: 44%; }
      .map-stage { padding: 14px; }
      #sim-ui { width: 100%; height: auto; top: auto; bottom: 0; flex-direction: column; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
  <script type="module" crossorigin src="/tehri-twin/assets/index-Dl24Xs_H.js"></script>
</head>

  <div id="loading-screen">
    <svg class="boot-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M5 27 C5 15 9 6 16 6 C23 6 27 15 27 27 Z"/>
      <path d="M3 22 H29 M3 25 H29"/>
    </svg>
    <h1>Dambreak</h1>
  </div>
</body>
